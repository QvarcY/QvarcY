<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#131829"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff04" stroke-width="0.5"/>
    </pattern>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset="25%" stop-color="#64ffda" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#64ffda" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#48c9b0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- LEFT SIDE: Identity -->
  <g transform="translate(80, 0)">
    <text x="0" y="152" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="#64ffda" opacity="0.35">
      <tspan>&gt;_<animate attributeName="opacity" values="0.35;0.5;0.35" dur="3.5s" repeatCount="indefinite"/></tspan>
    </text>

    <text x="56" y="152" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="url(#nameGrad)" filter="url(#softGlow)">QvarcY</text>

    <rect x="344" y="112" width="3" height="52" fill="#64ffda" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0;0.55" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(0, 180)">
      <circle cx="5" cy="0" r="3" fill="#64ffda" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="4" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="11" fill="#64748b" letter-spacing="0.8">status: building</text>
    </g>

    <rect x="0" y="206" width="360" height="1.2" rx="1" fill="url(#accentGrad)">
      <animate attributeName="width" values="0;360" dur="1.2s" fill="freeze" begin="0.4s"/>
    </rect>

    <text x="0" y="238" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="15" fill="#8892b0" letter-spacing="0.4">building useful things from annoying problems</text>

    <text x="0" y="272" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#64748b" letter-spacing="1.5">
      <tspan>build</tspan>
      <tspan fill="#64ffda" opacity="0.45"> → </tspan>
      <tspan>test</tspan>
      <tspan fill="#64ffda" opacity="0.45"> → </tspan>
      <tspan>break</tspan>
      <tspan fill="#64ffda" opacity="0.45"> → </tspan>
      <tspan>fix</tspan>
      <tspan fill="#64ffda" opacity="0.45"> → </tspan>
      <tspan>ship</tspan>
    </text>
  </g>

  <!-- RIGHT SIDE: Pipeline -->
  <g transform="translate(720, 0)">

    <line x1="0" y1="160" x2="380" y2="160" stroke="#64ffda" stroke-width="1" opacity="0.1"/>

    <!-- Stage 1: BUILD -->
    <g transform="translate(20, 160)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3">
        <animate attributeName="r" values="16;16.5;16" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6" fill="#64ffda" opacity="0.15"/>
      <circle cx="0" cy="0" r="3" fill="#64ffda" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.3;0.55" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8892b0" text-anchor="middle" letter-spacing="1">build</text>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#64ffda" stroke-width="1.5" opacity="0.55" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="1.2s" begin="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.55;0" dur="1.2s" begin="1.7s" fill="freeze"/>
      </circle>
    </g>

    <!-- Connector 1 -->
    <line x1="48" y1="160" x2="90" y2="160" stroke="#64ffda" stroke-width="0.8" opacity="0.08">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3.5s" repeatCount="indefinite"/>
    </line>

    <!-- Stage 2: TEST -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#64ffda" opacity="0.15"/>
      <circle cx="0" cy="0" r="3" fill="#64ffda" opacity="0.55"/>
      <text x="0" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8892b0" text-anchor="middle" letter-spacing="1">test</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0.75;0.75;0;0" dur="9s" repeatCount="indefinite" begin="2.5s"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#e06c75" stroke-width="1" opacity="0.55"/>
        <text x="0" y="-26" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#e06c75" text-anchor="middle" letter-spacing="1" font-weight="600">FAIL</text>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#e06c75" stroke-width="1.3" opacity="0.7"/>
        <line x1="4" y1="-4" x2="-4" y2="4" stroke="#e06c75" stroke-width="1.3" opacity="0.7"/>
      </g>
    </g>

    <!-- Connector 2 -->
    <line x1="138" y1="160" x2="180" y2="160" stroke="#64ffda" stroke-width="0.8" opacity="0.08">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3.5s" repeatCount="indefinite" begin="0.6s"/>
    </line>

    <!-- Stage 3: FIX -->
    <g transform="translate(200, 160)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#64ffda" opacity="0.15"/>
      <circle cx="0" cy="0" r="3" fill="#64ffda" opacity="0.55"/>
      <text x="0" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8892b0" text-anchor="middle" letter-spacing="1">fix</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0.7;0;0" dur="9s" repeatCount="indefinite" begin="4s"/>
        <text x="0" y="-26" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#48c9b0" text-anchor="middle" letter-spacing="0.5" opacity="0.75">edge case</text>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#48c9b0" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 4">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Connector 3 -->
    <line x1="228" y1="160" x2="270" y2="160" stroke="#64ffda" stroke-width="0.8" opacity="0.08">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3.5s" repeatCount="indefinite" begin="1.2s"/>
    </line>

    <!-- Stage 4: SHIP -->
    <g transform="translate(290, 160)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#64ffda" opacity="0.15"/>
      <circle cx="0" cy="0" r="3" fill="#64ffda" opacity="0.55"/>
      <text x="0" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#8892b0" text-anchor="middle" letter-spacing="1">ship</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0.8;0.8;0;0" dur="9s" repeatCount="indefinite" begin="5.5s"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.6"/>
        <text x="0" y="-26" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#64ffda" text-anchor="middle" letter-spacing="1" font-weight="600">PASS</text>
        <polyline points="-4,0 -1,3 5,-2" fill="none" stroke="#64ffda" stroke-width="1.3" opacity="0.75"/>
      </g>
    </g>

    <!-- Flow pulse — synced to narrative sequence -->
    <circle cx="20" cy="160" r="1.8" fill="#64ffda" opacity="0">
      <animate attributeName="cx" values="20;20;110;110;200;200;290;290" dur="9s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0.5;0.5;0.5;0.5;0" dur="9s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <circle cx="20" cy="160" r="1.8" fill="#64ffda" opacity="0">
      <animate attributeName="cx" values="20;20;110;110;200;200;290;290" dur="9s" repeatCount="indefinite" begin="4.5s"/>
      <animate attributeName="opacity" values="0;0.35;0.35;0.35;0.35;0.35;0.35;0" dur="9s" repeatCount="indefinite" begin="4.5s"/>
    </circle>

    <!-- Micro-event text — strictly sequential, no overlap -->
    <text x="190" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#64ffda" text-anchor="middle" opacity="0" letter-spacing="0.5">
      build ... test ... FAIL
      <animate attributeName="opacity" values="0;0.6;0.6;0;0" dur="9s" repeatCount="indefinite" begin="2.5s"/>
    </text>

    <text x="190" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#48c9b0" text-anchor="middle" opacity="0" letter-spacing="0.5">
      edge case found → fix applied
      <animate attributeName="opacity" values="0;0;0;0;0.6;0.6;0;0" dur="9s" repeatCount="indefinite" begin="4s"/>
    </text>

    <text x="190" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#64ffda" text-anchor="middle" opacity="0" letter-spacing="0.5">
      test ... PASS → ship ✓
      <animate attributeName="opacity" values="0;0;0;0;0;0;0.6;0.6" dur="9s" repeatCount="indefinite" begin="5.5s"/>
    </text>

  </g>

  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGrad)" opacity="0.35"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#accentGrad)" opacity="0.15"/>
</svg>